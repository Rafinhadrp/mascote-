# Gera o MascoteR.exe (Windows) e publica em Releases a cada push.
name: Mascote R para Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Controle remoto: a sala (e, se quiser, um servidor próprio) vem dos segredos do repositório,
      # pra não ficar visível no código. Sem MASCOTE_SALA o .exe sai sem controle remoto.
      - name: Configuração do controle remoto
        shell: bash
        env:
          SALA: ${{ secrets.MASCOTE_SALA }}
          SERVIDOR: ${{ secrets.MASCOTE_SERVIDOR }}
          USUARIO: ${{ secrets.MASCOTE_USUARIO }}
          SENHA: ${{ secrets.MASCOTE_SENHA }}
          DONO: ${{ vars.MASCOTE_DONO }}
        run: |
          node -e "const e = process.env; require('fs').writeFileSync('remoto.json', JSON.stringify({ sala: e.SALA || '', servidor: e.SERVIDOR || undefined, usuario: e.USUARIO || undefined, senha: e.SENHA || undefined, dono: e.DONO || 'Rafinha' }))"

      - run: npm run empacotar

      - uses: actions/upload-artifact@v4
        with:
          name: MascoteR-windows
          path: dist/MascoteR.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mascote-v${{ github.run_number }}
          name: Mascote <R/> para Windows (versão ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/MascoteR.exe
          body: |
            Baixe o **MascoteR.exe** aqui embaixo e dê dois cliques. Não precisa instalar nada.

            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**
            (aparece porque o app não tem assinatura digital paga).

            Pra mandar ele fazer coisas, mudar o tamanho, pausar ou fechar: clique no iconezinho dele perto do relógio.
